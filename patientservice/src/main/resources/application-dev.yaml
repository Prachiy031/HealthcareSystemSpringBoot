spring:
  cloud:
    config:
      enabled: false
      
  data:
    mongodb:  #we are using key names stored in vault as username and passoword placeholders
      uri:  mongodb://${mongo_username}:${mongo_password}@127.0.0.1:27017/healthcare?authSource=admin  #before usig vault it was : ${MONGO_URI:mongodb://root:rootpassword@127.0.0.1:27017/healthcare?authSource=admin}
   
  config:             #vault configuration
    import: vault://

  cloud:
    vault:
      uri: http://127.0.0.1:8200
      token: ${VAULT_TOKEN}
      kv:
        enabled: true
        backend: secret
        backend-version: 2
        
        
logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.servlet: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics"
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      

  

server:
  port: ${PATIENT_SERVICE_PORT:8083}
  
  