spring:
  cloud:
    config:
      enabled: false
  boot:
    admin:
      client:
        enabled: false
        instance:
          name: Patient Service
          service-url: ${ADMIN_CLIENT_INSTANCE_SERVICE_URL:http://127.0.0.1:8083}    #address of service which is registering itself with admin server
        url: ${ADMIN_CLIENT_URL:http://127.0.0.1:9080}            #address of admin server to which services are registering for monitoring and metrics viewing on UI
        auto-registration: true
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://root:rootpassword@127.0.0.1:27017/healthcare?authSource=admin}

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.servlet: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"
        exclude: env
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: "*"
        liveness:
          include: "*"

server:
  port: ${PATIENT_SERVICE_PORT:8083}