spring:
  cloud:
    config:
      enabled: false
  
  mail:
    host: smtp.gmail.com    #gmail's smtp host
    port: 587      #gmail's smtp submission port using starttls
    username: ${mail_username}
    password: ${mail_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            
  config:  #for vault configuration
    import: vault://

  cloud:
    vault:
      uri: http://127.0.0.1:8200
      token: ${VAULT_TOKEN}
      kv:
        enabled: true
        backend: secret
        backend-version: 2
            
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics"
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      

server:
  port: ${NOTIFICATION_SERVICE_PORT:8084}
         