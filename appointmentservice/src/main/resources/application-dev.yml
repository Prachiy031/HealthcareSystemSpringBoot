app:
  environment: dev

spring:
  cloud:
    config:
      enabled: false
      
  data:
    mongodb:    #due to vault we can use key names as per stored in vault
      uri:  mongodb://${mongo_username}:${mongo_password}@127.0.0.1:27017/healthcare?authSource=admin    #before using vault it was: ${MONGO_URI:mongodb://root:rootpassword@127.0.0.1:27017/healthcare?authSource=admin}
      
  config:             #for vault configuration
    import: vault://

  cloud:
    vault:
      uri: http://127.0.0.1:8200
      token: ${VAULT_TOKEN}
      kv:
        enabled: true
        backend: secret
        backend-version: 2
        
logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.servlet: DEBUG
    org.apache.kafka.clients.producer: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics"
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

server:
  port: ${APPOINTMENT_SERVICE_PORT:8480}

doctor:
  service:
    url: ${DOCTOR_SERVICE_URL:http://doctor-service:8082/api/v1/doctor}

patient:
  service:
    url: ${PATIENT_SERVICE_URL:http://patient-service:8083/api/v1/patient}
    
notification:
  service:
    url: ${NOTIFICATION_SERVICE_URL:http://notification-service:8084/api/v1/notification}
