app:
  environment: dev

spring:
  cloud:
    config:
      enabled: false
  boot:
    admin:
      client:
        enabled: false
        instance:
          name: Appointment Service
          service-url: ${ADMIN_CLIENT_INSTANCE_SERVICE_URL:http://127.0.0.1:8480}
        url: ${ADMIN_CLIENT_URL:http://127.0.0.1:9080}
        auto-registration: true
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://root:rootpassword@127.0.0.1:27017/healthcare?authSource=admin}

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.servlet: DEBUG
    org.apache.kafka.clients.producer: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"
        exclude: env
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: "*"
        liveness:
          include: "*"

server:
  port: ${APPOINTMENT_SERVICE_PORT:8480}

doctor:
  service:
    url: ${DOCTOR_SERVICE_URL:http://doctor-service:8082/api/v1/doctor}

patient:
  service:
    url: ${PATIENT_SERVICE_URL:http://patient-service:8083/api/v1/patient}
    
notification:
  service:
    url: ${NOTIFICATION_SERVICE_URL:http://notification-service:8084/api/v1/notification}
