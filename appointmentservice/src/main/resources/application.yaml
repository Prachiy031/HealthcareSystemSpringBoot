spring:
  application:
    name: appointment-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  security:
    oauth2:
      resourceserver:    #Appointment service is resource server {application that protects its apis using access tokens} 
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/healthcare-system}     #identifies keycloak realm that issues your token
          
eureka:          #this service acts as eureka client and registers itself with eureka server 
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/