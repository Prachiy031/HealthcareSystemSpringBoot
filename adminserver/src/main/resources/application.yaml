spring:
  application:
    name: admin-server
    
eureka:           #admin server will be eureka server client for retrieving service's data through eureka for monitoring
  client:
    service-url:
      defaultzone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: always
    
server:
  port: 9080
