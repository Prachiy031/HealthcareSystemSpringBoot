server:
  port: 8888

spring:
  application:
    name: config-server

  cloud:
    config:
      server:
        git:
          uri: https://github.com/Prachiy031/HealthcareSystemConfig.git
          default-label: main
          clone-on-start: true
          refresh-rate: 0
          username: ${git_username}
          password: ${git_token}

management:
  endpoints:
    web:
      exposure:
        include: "health,info"